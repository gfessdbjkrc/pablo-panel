<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>تنظیمات پنل | PABLO PANEL</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Vazirmatn', sans-serif;
        }

        body {
            min-height: 100vh;
            background:
                radial-gradient(circle at top right, rgba(0, 140, 255, .18), transparent 35%),
                radial-gradient(circle at bottom left, rgba(0, 80, 255, .12), transparent 35%),
                #050914;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        /* ذرات شناور پس‌زمینه */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image:
                radial-gradient(circle at 20% 50%, rgba(0, 170, 255, 0.05) 1px, transparent 1px),
                radial-gradient(circle at 80% 20%, rgba(0, 170, 255, 0.05) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: -1;
            animation: float 20s linear infinite;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            100% { transform: translateY(-50px); }
        }

        .container {
            width: 100%;
            max-width: 520px;
            animation: fadeInUp 0.6s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card {
            background: rgba(8, 15, 30, .92);
            border: 1px solid rgba(0, 153, 255, .35);
            border-radius: 24px;
            padding: 35px 30px;
            box-shadow:
                0 0 35px rgba(0, 119, 255, .12),
                inset 0 0 25px rgba(0, 119, 255, .025);
            backdrop-filter: blur(15px);
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, transparent, #00aaff, transparent);
            animation: shine 3s linear infinite;
        }

        @keyframes shine {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header-icon {
            width: 65px;
            height: 65px;
            margin: 0 auto 15px;
            background: linear-gradient(135deg, #0077ff, #00b7ff);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 30px rgba(0, 140, 255, 0.4);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 10px 30px rgba(0, 140, 255, 0.4); }
            50% { box-shadow: 0 10px 40px rgba(0, 140, 255, 0.7); }
        }

        .header-icon svg {
            width: 32px;
            height: 32px;
            fill: #fff;
        }

        .title {
            font-size: 26px;
            font-weight: 800;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #fff, #00aaff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: #8290a8;
            font-size: 13px;
            font-weight: 400;
        }

        .current {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 22px;
            padding: 14px 16px;
            background: rgba(0, 140, 255, .06);
            border: 1px solid rgba(0, 140, 255, .15);
            border-radius: 13px;
            color: #8494ad;
            font-size: 13px;
            font-weight: 500;
        }

        .current-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .current-info svg {
            width: 18px;
            height: 18px;
            fill: #00aaff;
        }

        .current strong {
            color: #00aaff;
            font-weight: 700;
            margin-right: 5px;
        }

        .copy-btn {
            background: rgba(0, 170, 255, 0.1);
            border: 1px solid rgba(0, 170, 255, 0.3);
            color: #00aaff;
            padding: 6px 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 600;
            font-family: 'Vazirmatn', sans-serif;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .copy-btn:hover {
            background: rgba(0, 170, 255, 0.2);
            transform: scale(1.05);
        }

        .copy-btn svg {
            width: 13px;
            height: 13px;
            fill: currentColor;
        }

        .group {
            margin-bottom: 18px;
        }

        label {
            display: flex;
            align-items: center;
            gap: 7px;
            margin-bottom: 8px;
            color: #aebbd0;
            font-size: 13px;
            font-weight: 600;
        }

        label svg {
            width: 15px;
            height: 15px;
            fill: #00aaff;
        }

        .input-wrapper {
            position: relative;
        }

        input {
            width: 100%;
            height: 52px;
            border-radius: 14px;
            border: 1px solid #1d3150;
            outline: none;
            background: #08111f;
            color: #fff;
            padding: 0 15px;
            font-size: 15px;
            transition: .25s;
            font-family: 'Vazirmatn', sans-serif;
        }

        input[type="password"] {
            padding-left: 50px;
            letter-spacing: 2px;
        }

        input:focus {
            border-color: #008cff;
            box-shadow: 0 0 15px rgba(0, 140, 255, .2);
            background: #0a1424;
        }

        input::placeholder {
            color: #4a5568;
            font-size: 13px;
        }

            position: absolute;
            left: 12px;
